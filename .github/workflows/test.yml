# 这个文件放在 .github/workflows/test.yml 中

name: Test Scanner Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 钉到 commit SHA：标签（@v4）是可以被移动的，SHA 不能。
    # 升级时同步改 SHA 与行尾注释里的版本号。
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        # 3.10 是 requirements.txt 里钉死的依赖要求的下限，别再调回去
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 覆盖率随构建一起跑，数字在日志里，方便核对 README 与 TESTING.md。
    # 不含 --cov=main：这个 runner 的 Python 没有 _tkinter，tests/test_desktop.py 会整体跳过。
    - name: Test with pytest
      run: |
        pytest --cov=scanner_core --cov=taint --cov=webui --cov=webapp --cov-report=term-missing
